name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    name: Linux x86_64 二进制
    runs-on: ubuntu-latest
    # 正常 4 分钟出头；默认 360 分钟意味着一次卡死就白烧 6 小时额度，收紧到 20 分钟。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build admin-ui
        working-directory: admin-ui
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # wreq 走 BoringSSL(btls-sys)，源码编译需要 cmake；g++/perl runner 自带。
      # cmake 其实 runner 也自带（ubuntu-24.04 镜像里是 3.31，装在 /usr/local，apt 看不见
      # 它，所以原来那句 `apt-get install cmake` 是实打实地又下了一份 3.28 覆盖上去）。
      # 而从 v0.2.92 起这一步开始卡死在 apt-get 上，两次 tag 分别挂到 24m 和 2h47m 才被
      # 手动取消。既然本来就多余：先探测，只有真没有才装（自托管 runner 的退路），
      # 且 5 分钟没装完就判失败，不再把整个 job 拖住。
      - name: Ensure cmake (BoringSSL 需要)
        timeout-minutes: 5
        run: |
          if command -v cmake >/dev/null 2>&1; then
            cmake --version
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends cmake

      - name: Build release
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luban-linux-x64
          path: target/release/luban
          if-no-files-found: error
