[package]
name = "luban"
version = "0.1.9"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
dirs = "6.0.0"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
mime_guess = "2"
parking_lot = "0.12.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "stream"] }
rusqlite = { version = "0.34", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order：Map 换成 IndexMap，保留 JSON 对象的原始 key 顺序。
# 转发前改写请求体要原样重新序列化，默认的 BTreeMap 会把整个 body 的 key 按字母序重排
# （官方客户端不会产生的排列，一次精确比对即可判定中间有代理）。见 proxy::rewrite_body。
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
