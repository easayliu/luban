services:
  postgres:
    image: postgres:17
    container_name: luban-postgres
    environment:
      - POSTGRES_USER=luban
      # 必填：在同目录的 .env 里写 POSTGRES_PASSWORD=<随机串>（install.sh 会自动生成）。
      # 不给默认值：库只在第一次启动时按它建超级用户，落成一个人人都知道的密码就改不掉了。
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?在 .env 里设置 POSTGRES_PASSWORD}
      - POSTGRES_DB=luban
    # 默认 64MB 的 /dev/shm 不够并行查询用，大一点的统计查询会报 shared memory 错误。
    shm_size: 256mb
    # PG 默认 shared_buffers 只有 128MB，流水表几 GB 时缓存命中率掉到六成、额度统计秒级。
    # 取值按官方文档（Server Configuration）与 wiki「Tuning Your PostgreSQL Server」：
    # shared_buffers 取内存 1/4，effective_cache_size 取 3/4，加大 shared_buffers 时同步加大
    # max_wal_size；SSD 上 random_page_cost 取 1.1、effective_io_concurrency 取数百。
    # 随内存变的几项由 install.sh 按本机内存算好写进 .env，这里的缺省值按 4GB 内存取。
    # 改完要重启 postgres：docker compose up -d postgres。
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-512MB}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
    volumes:
      # 数据库文件持久化到宿主机 ./pgdata。备份别直接拷这个目录（运行中拷出来的不一致），
      # 用 pg_dump，见 install.sh 结尾的说明。
      - ./pgdata/:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luban -d luban"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  luban:
    # 国内镜像可用：ghcr.nju.edu.cn/${IMAGE_OWNER:-easayliu}/luban:${IMAGE_TAG:-latest}
    image: ghcr.io/${IMAGE_OWNER:-easayliu}/luban:${IMAGE_TAG:-latest}
    container_name: luban
    # 用 tini 当 PID 1：转发信号并回收僵尸进程，配合应用内优雅关闭让重启秒停。
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-4600}:4600"
    environment:
      # 接入 Key：留空则改由网页「接入设置」管理
      - LUBAN_API_KEY=${LUBAN_API_KEY:-}
      - LUBAN_DATABASE_URL=postgres://luban:${POSTGRES_PASSWORD:?在 .env 里设置 POSTGRES_PASSWORD}@postgres:5432/luban
    volumes:
      # 加密库内 token 的密钥文件（secret.key）持久化到宿主机 ./config（容器内 LUBAN_HOME=/app/config）。
      # 它与数据库要一起备份：丢了它，库里的账号全部要重新授权。
      - ./config/:/app/config/
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
